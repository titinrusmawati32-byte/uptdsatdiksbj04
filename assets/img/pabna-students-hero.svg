<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="uniformBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="tieBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="bookCover1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="bookCover2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <rect width="640" height="480" fill="url(#bgGlow)" rx="24"/>

  <!-- Bokeh light bubbles -->
  <circle cx="80" cy="100" r="90" fill="#ffffff" opacity="0.12"/>
  <circle cx="560" cy="80" r="110" fill="#93c5fd" opacity="0.18"/>
  <circle cx="580" cy="380" r="130" fill="#60a5fa" opacity="0.15"/>
  <circle cx="120" cy="400" r="70" fill="#ffffff" opacity="0.08"/>

  <!-- School Building in Background -->
  <g opacity="0.45">
    <!-- Main building body -->
    <rect x="80" y="80" width="480" height="180" fill="#e2e8f0" rx="6"/>
    <rect x="80" y="80" width="480" height="24" fill="#94a3b8"/>
    <!-- Windows rows -->
    <g fill="#0284c7" opacity="0.65">
      <rect x="110" y="120" width="36" height="40" rx="3"/>
      <rect x="160" y="120" width="36" height="40" rx="3"/>
      <rect x="210" y="120" width="36" height="40" rx="3"/>
      <rect x="260" y="120" width="36" height="40" rx="3"/>
      <rect x="340" y="120" width="36" height="40" rx="3"/>
      <rect x="390" y="120" width="36" height="40" rx="3"/>
      <rect x="440" y="120" width="36" height="40" rx="3"/>
      <rect x="490" y="120" width="36" height="40" rx="3"/>

      <rect x="110" y="180" width="36" height="40" rx="3"/>
      <rect x="160" y="180" width="36" height="40" rx="3"/>
      <rect x="210" y="180" width="36" height="40" rx="3"/>
      <rect x="260" y="180" width="36" height="40" rx="3"/>
      <rect x="340" y="180" width="36" height="40" rx="3"/>
      <rect x="390" y="180" width="36" height="40" rx="3"/>
      <rect x="440" y="180" width="36" height="40" rx="3"/>
      <rect x="490" y="180" width="36" height="40" rx="3"/>
    </g>
    <!-- Roof Pillars & Signboard -->
    <rect x="220" y="90" width="200" height="22" fill="#1e3a8a" rx="4"/>
    <text x="320" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle" letter-spacing="1">SDN SUMBEREJO 04 AMBULU</text>
  </g>

  <!-- Foliage / Trees in background -->
  <circle cx="70" cy="240" r="50" fill="#15803d" opacity="0.6"/>
  <circle cx="110" cy="220" r="40" fill="#16a34a" opacity="0.6"/>
  <circle cx="570" cy="230" r="60" fill="#15803d" opacity="0.6"/>
  <circle cx="530" cy="210" r="45" fill="#16a34a" opacity="0.6"/>

  <!-- STUDENT 1 (BOY - LEFT) -->
  <g filter="url(#softShadow)">
    <!-- Body & Shirt -->
    <path d="M 180 480 L 190 320 C 190 280, 240 270, 260 270 C 280 270, 330 280, 330 320 L 340 480 Z" fill="#ffffff"/>
    <!-- Blue Tie -->
    <path d="M 255 285 L 265 285 L 268 370 L 260 385 L 252 370 Z" fill="url(#tieBlue)"/>
    <!-- Shirt Collar -->
    <polygon points="260,295 235,275 255,275" fill="#f1f5f9"/>
    <polygon points="260,295 285,275 265,275" fill="#f1f5f9"/>
    <!-- Backpack Straps -->
    <path d="M 205 295 C 195 340 195 400 200 480" stroke="#1e293b" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M 315 295 C 325 340 325 400 320 480" stroke="#1e293b" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- Neck -->
    <rect x="245" y="240" width="30" height="40" fill="#fed7aa" rx="6"/>
    <!-- Head -->
    <ellipse cx="260" cy="205" rx="36" ry="42" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 224 200 C 220 155, 270 145, 295 165 C 305 175, 305 195, 300 205 C 290 185, 275 180, 255 180 C 235 180, 225 190, 224 200 Z" fill="#1e1b4b"/>
    <!-- Smile & Eyes -->
    <circle cx="248" cy="202" r="3.5" fill="#1e293b"/>
    <circle cx="272" cy="202" r="3.5" fill="#1e293b"/>
    <path d="M 250 220 Q 260 230 270 220" stroke="#ea580c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Eyebrows -->
    <path d="M 243 192 Q 248 189 253 192" stroke="#1e1b4b" stroke-width="2" fill="none"/>
    <path d="M 267 192 Q 272 189 277 192" stroke="#1e1b4b" stroke-width="2" fill="none"/>

    <!-- Blue Textbook in Arms -->
    <g transform="rotate(-12 260 380)">
      <rect x="220" y="340" width="85" height="115" rx="6" fill="url(#bookCover1)" stroke="#ffffff" stroke-width="2"/>
      <rect x="226" y="346" width="12" height="103" rx="2" fill="#38bdf8"/>
      <line x1="245" y1="365" x2="295" y2="365" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <line x1="245" y1="380" x2="285" y2="380" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="270" cy="415" r="14" fill="#ffffff" opacity="0.25"/>
    </g>
  </g>

  <!-- STUDENT 2 (GIRL - RIGHT) -->
  <g filter="url(#softShadow)">
    <!-- Blue Pinafore / Dress -->
    <path d="M 370 480 L 375 325 C 375 285, 420 275, 440 275 C 460 275, 505 285, 505 325 L 510 480 Z" fill="url(#uniformBlue)"/>
    <!-- White inner blouse -->
    <path d="M 410 275 L 470 275 L 460 340 L 420 340 Z" fill="#ffffff"/>
    <!-- Blue Tie -->
    <path d="M 436 290 L 444 290 L 446 360 L 440 370 L 434 360 Z" fill="url(#tieBlue)"/>
    <!-- Neck -->
    <rect x="425" y="245" width="30" height="36" fill="#fcd34d" rx="6"/>
    <!-- Head -->
    <ellipse cx="440" cy="210" rx="35" ry="40" fill="#fcd34d"/>
    <!-- Braided Hair -->
    <path d="M 405 210 C 400 150, 480 150, 475 210 C 465 175, 415 175, 405 210 Z" fill="#0f172a"/>
    <path d="M 405 215 C 395 240, 390 280, 395 310" stroke="#0f172a" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M 475 215 C 485 240, 490 280, 485 310" stroke="#0f172a" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- Cute Hair Ribbons (Blue) -->
    <circle cx="395" cy="305" r="6" fill="#38bdf8"/>
    <circle cx="485" cy="305" r="6" fill="#38bdf8"/>
    <!-- Smile & Eyes -->
    <circle cx="428" cy="206" r="3.5" fill="#1e293b"/>
    <circle cx="452" cy="206" r="3.5" fill="#1e293b"/>
    <path d="M 430 223 Q 440 233 450 223" stroke="#e11d48" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Cheeks (Blush) -->
    <circle cx="420" cy="216" r="5" fill="#f43f5e" opacity="0.3"/>
    <circle cx="460" cy="216" r="5" fill="#f43f5e" opacity="0.3"/>

    <!-- Book in Hand (Orange/Gold) -->
    <g transform="rotate(8 440 390)">
      <rect x="400" y="350" width="80" height="110" rx="6" fill="url(#bookCover2)" stroke="#ffffff" stroke-width="2"/>
      <rect x="462" y="356" width="12" height="98" rx="2" fill="#fde047"/>
      <line x1="415" y1="375" x2="455" y2="375" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <line x1="415" y1="390" x2="445" y2="390" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Small Steps, Big Dreams Script Badge -->
  <g transform="translate(480, 140) rotate(-6)">
    <text x="0" y="0" font-family="'Brush Script MT', 'Dancing Script', cursive, sans-serif" font-size="28" fill="#ffffff" font-weight="bold" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.4))">
      Small Steps,
    </text>
    <text x="15" y="28" font-family="'Brush Script MT', 'Dancing Script', cursive, sans-serif" font-size="28" fill="#fef08a" font-weight="bold" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.4))">
      Big Dreams ✨
    </text>
  </g>
</svg>
