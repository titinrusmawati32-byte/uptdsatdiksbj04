<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="schoolWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="roofRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="grassGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Clear Sky -->
  <rect width="600" height="400" fill="url(#skyBlue)"/>

  <!-- Clouds -->
  <path d="M 60 90 Q 90 60 130 80 Q 170 50 210 80 Q 240 100 230 120 L 50 120 Z" fill="#ffffff" opacity="0.6"/>
  <path d="M 380 70 Q 420 40 460 60 Q 500 40 530 70 Q 560 90 540 110 L 370 110 Z" fill="#ffffff" opacity="0.5"/>

  <!-- School Lawn / Ground -->
  <rect x="0" y="270" width="600" height="130" fill="url(#grassGreen)"/>
  <path d="M 220 400 L 260 280 L 340 280 L 380 400 Z" fill="#cbd5e1" opacity="0.7"/>

  <!-- Trees & Greenery behind school -->
  <g fill="#15803d">
    <circle cx="50" cy="230" r="45"/>
    <circle cx="90" cy="220" r="40"/>
    <circle cx="130" cy="240" r="35"/>
    <circle cx="470" cy="240" r="35"/>
    <circle cx="510" cy="220" r="40"/>
    <circle cx="550" cy="230" r="45"/>
  </g>

  <!-- MAIN SCHOOL BUILDING (SDN SUMBEREJO 04) -->
  <g>
    <!-- Main Wall 3 Floors -->
    <rect x="110" y="140" width="380" height="145" fill="url(#schoolWall)" rx="4"/>
    
    <!-- Central Entrance Portal / Portico -->
    <rect x="240" y="130" width="120" height="155" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Triangular Pediment -->
    <polygon points="300,95 235,130 365,130" fill="url(#roofRed)"/>

    <!-- School Signboard on building -->
    <rect x="248" y="145" width="104" height="20" fill="#1e3a8a" rx="3"/>
    <text x="300" y="159" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="8" fill="#fde047" text-anchor="middle" letter-spacing="0.5">SDN SUMBEREJO 04</text>

    <!-- Indonesian Flagpole on Front Lawn -->
    <line x1="180" y1="280" x2="180" y2="120" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="180" cy="118" r="3" fill="#f59e0b"/>
    <!-- Flag waving -->
    <path d="M 180 122 Q 195 116 210 123 Q 220 127 210 134 Q 195 127 180 132 Z" fill="#ef4444"/>
    <path d="M 180 132 Q 195 127 210 134 Q 220 138 210 145 Q 195 138 180 143 Z" fill="#ffffff"/>

    <!-- Windows Left Wing (3 floors x 3 columns) -->
    <g fill="#0284c7" stroke="#ffffff" stroke-width="1.5">
      <rect x="130" y="155" width="24" height="28" rx="2"/>
      <rect x="165" y="155" width="24" height="28" rx="2"/>
      <rect x="200" y="155" width="24" height="28" rx="2"/>

      <rect x="130" y="195" width="24" height="28" rx="2"/>
      <rect x="165" y="195" width="24" height="28" rx="2"/>
      <rect x="200" y="195" width="24" height="28" rx="2"/>

      <rect x="130" y="235" width="24" height="28" rx="2"/>
      <rect x="165" y="235" width="24" height="28" rx="2"/>
      <rect x="200" y="235" width="24" height="28" rx="2"/>
    </g>

    <!-- Windows Right Wing (3 floors x 3 columns) -->
    <g fill="#0284c7" stroke="#ffffff" stroke-width="1.5">
      <rect x="375" y="155" width="24" height="28" rx="2"/>
      <rect x="410" y="155" width="24" height="28" rx="2"/>
      <rect x="445" y="155" width="24" height="28" rx="2"/>

      <rect x="375" y="195" width="24" height="28" rx="2"/>
      <rect x="410" y="195" width="24" height="28" rx="2"/>
      <rect x="445" y="195" width="24" height="28" rx="2"/>

      <rect x="375" y="235" width="24" height="28" rx="2"/>
      <rect x="410" y="235" width="24" height="28" rx="2"/>
      <rect x="445" y="235" width="24" height="28" rx="2"/>
    </g>

    <!-- Center Grand Entrance Double Doors -->
    <rect x="282" y="235" width="36" height="45" fill="#1e293b" rx="2"/>
    <line x1="300" y1="235" x2="300" y2="280" stroke="#f8fafc" stroke-width="1.5"/>
    <circle cx="295" cy="258" r="1.5" fill="#fbbf24"/>
    <circle cx="305" cy="258" r="1.5" fill="#fbbf24"/>

    <!-- Clock in Center Pediment -->
    <circle cx="300" cy="118" r="8" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
    <line x1="300" y1="118" x2="300" y2="114" stroke="#1e3a8a" stroke-width="1.2"/>
    <line x1="300" y1="118" x2="303" y2="120" stroke="#1e3a8a" stroke-width="1.2"/>
  </g>
</svg>
