<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <!-- Metallic Royal Gold Linear Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="25%" stop-color="#F5C02A"/>
      <stop offset="50%" stop-color="#E5A817"/>
      <stop offset="75%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#9A6500"/>
    </linearGradient>

    <!-- Shiny Specular Highlight -->
    <linearGradient id="goldLightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8"/>
      <stop offset="50%" stop-color="#E5A817"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#CA8A04" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#goldGlow)">
    <!-- ==========================================
         1. THE GLOBE (BOLA DUNIA)
         ========================================== -->
    <!-- Globe Outer Circle -->
    <circle cx="250" cy="155" r="76" fill="none" stroke="url(#goldGrad)" stroke-width="9"/>

    <!-- Globe Longitude (Garis Bujur Vertikal) -->
    <!-- Center Meridian -->
    <line x1="250" y1="79" x2="250" y2="231" stroke="url(#goldGrad)" stroke-width="6"/>
    <!-- Inner Ellipse -->
    <ellipse cx="250" cy="155" rx="36" ry="76" fill="none" stroke="url(#goldGrad)" stroke-width="5"/>
    <!-- Outer Ellipse -->
    <ellipse cx="250" cy="155" rx="60" ry="76" fill="none" stroke="url(#goldGrad)" stroke-width="4.5"/>

    <!-- Globe Latitude (Garis Lintang Horizontal) -->
    <!-- Equator -->
    <line x1="174" y1="155" x2="326" y2="155" stroke="url(#goldGrad)" stroke-width="5.5"/>
    <!-- Northern Upper Parallel -->
    <path d="M 190 120 Q 250 135 310 120" fill="none" stroke="url(#goldGrad)" stroke-width="4.5"/>
    <!-- Northern Far Upper Parallel -->
    <path d="M 214 94 Q 250 104 286 94" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    <!-- Southern Lower Parallel -->
    <path d="M 190 190 Q 250 175 310 190" fill="none" stroke="url(#goldGrad)" stroke-width="4.5"/>
    <!-- Southern Far Lower Parallel -->
    <path d="M 214 216 Q 250 206 286 216" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>

    <!-- ==========================================
         2. THE OPEN BOOK (BUKU TERBUKA)
         ========================================== -->
    <!-- Left Fan Pages -->
    <!-- Layer 1 (Topmost thin leaf) -->
    <path d="M 238 238 C 210 206 172 176 142 148 L 148 144 C 180 172 216 204 242 234 Z" fill="url(#goldLightGrad)"/>
    <!-- Layer 2 (Second leaf) -->
    <path d="M 236 244 C 200 216 154 190 124 168 L 130 162 C 162 186 208 212 240 240 Z" fill="url(#goldLightGrad)"/>
    <!-- Layer 3 (Third thicker leaf) -->
    <path d="M 232 250 C 190 228 140 206 116 194 L 118 226 C 145 234 185 248 228 258 Z" fill="url(#goldGrad)"/>
    <!-- Layer 4 (Bottom cover leaf) -->
    <path d="M 234 256 C 185 250 148 245 114 234 L 114 266 C 152 278 195 284 236 270 Z" fill="url(#goldGrad)"/>

    <!-- Right Fan Pages (Symmetric) -->
    <!-- Layer 1 (Topmost thin leaf) -->
    <path d="M 262 238 C 290 206 328 176 358 148 L 352 144 C 320 172 284 204 258 234 Z" fill="url(#goldLightGrad)"/>
    <!-- Layer 2 (Second leaf) -->
    <path d="M 264 244 C 300 216 346 190 376 168 L 370 162 C 338 186 292 212 260 240 Z" fill="url(#goldLightGrad)"/>
    <!-- Layer 3 (Third thicker leaf) -->
    <path d="M 268 250 C 310 228 360 206 384 194 L 382 226 C 355 234 315 248 272 258 Z" fill="url(#goldGrad)"/>
    <!-- Layer 4 (Bottom cover leaf) -->
    <path d="M 266 256 C 315 250 352 245 386 234 L 386 266 C 348 278 305 284 264 270 Z" fill="url(#goldGrad)"/>

    <!-- Book Spine V-Center -->
    <path d="M 232 254 L 250 274 L 268 254 L 258 276 L 250 282 L 242 276 Z" fill="url(#goldLightGrad)"/>

    <!-- Horizontal Foundation Base Bar -->
    <rect x="124" y="294" width="252" height="10" rx="5" fill="url(#goldGrad)"/>
  </g>
</svg>
